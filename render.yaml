# Data Rewind — Render Blueprint Specification
# Free Tier Deployment Configuration (₹0 / $0 Budget)
# Declares Python Web Service (Backend) and Static Site (Frontend)

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API Service
  # ---------------------------------------------------------------------------
  - type: web
    name: data-rewind-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn data_rewind.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_REWIND_PROFILE
        value: "hosted_demo"
      - key: DATA_REWIND_DATA_DIR
        value: "/tmp/data_rewind"
      - key: DATA_REWIND_CORS_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: data-rewind-ui
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
